- name: create caddy2 group
  group:
    name: "{{ caddy2_user }}"
    state: present

- name: create caddy2 user
  user:
    name: "{{ caddy2_user }}"
    group: "{{ caddy2_user }}"
    createhome: true

- name: create needed dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ caddy2_user }}"
  with_items:
    - /var/lib/caddy2
    - /etc/caddy2
    - /var/log/caddy2

- name: Create Caddyfile
  copy:
    content="{{ caddy2_config }}" dest="/etc/caddy2/Caddyfile" owner={{
    caddy2_user }}
  notify: restart caddy2

- name: Create Caddy json config
  copy:
    content="{{ caddy2_config_json }}" dest="/etc/caddy2/config.json" owner={{
    caddy2_user }}
  notify: restart caddy2
  when: caddy2_config_json is defined

- name: create install dir
  file:
    path: "{{ caddy2_install_dir }}"
    state: directory
    mode: "0755"

# Downloading on every run was enough to get a server rate limited by the
# release host, which then failed the deploy of a caddy that was already
# installed. Caching the tarball under its version means this asks for it once.
# The retries cover a connection the release host drops.
- name: fetch caddy
  get_url:
    url:
      https://github.com/caddyserver/caddy/releases/download/v{{ caddy2_version
      }}/caddy_{{ caddy2_version }}_linux_amd64.tar.gz
    dest: "{{ caddy2_tarball }}"
    mode: "0600"
  register: fetch
  until: fetch is succeeded
  retries: 3
  delay: 5

- name: extract caddy
  unarchive:
    src: "{{ caddy2_tarball }}"
    dest: "{{ caddy2_install_dir }}"
    remote_src: yes
    creates: "{{ caddy2_install_dir }}/caddy"

# Ansible installs through a temporary file and a rename, so this replaces the
# binary of a running caddy without stopping it first, and the handler restarts
# it once the whole play has had its say.
- name: install caddy binary
  copy:
    remote_src: yes
    src: "{{ caddy2_install_dir }}/caddy"
    dest: "{{ caddy2_binary }}"
    mode: "0755"
  notify: restart caddy2

- name: caddy2 service file
  template: src=caddy2.service.j2 dest=/etc/systemd/system/caddy2.service
  notify:
    - reload systemd caddy2
    - restart caddy2

- name: start caddy2
  service: name=caddy2 state=started enabled=yes
